[package]
name = "nexus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nexus-types = { path = "../types" }
nexus-strategy = { path = "../strategy" }
tvc.path = "../tvc"
memmap2 = "0.9"
libc = "0.2"
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
zip = "2"
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
cmaes = "0.2"
nalgebra = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
hmac = "0.12"
hex = "0.4"
secrecy = "0.4"
serde_urlencoded = "0.1"
base64 = "0.22"
async-trait = "0.1"
csv = "1.3"
once_cell = "1.19"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"

[[example]]
name = "orb_backtest"
path = "examples/orb_backtest.rs"

[[example]]
name = "csv_to_tvc"
path = "examples/csv_to_tvc.rs"

[[example]]
name = "compression_measure"
path = "examples/compression_measure.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"
